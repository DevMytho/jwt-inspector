name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli:
    name: CLI — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install core
        run: cd core && npm install

      - name: Install CLI
        run: cd cli && npm install

      - name: Typecheck
        run: cd cli && npx tsc --noEmit

      - name: Build
        run: cd cli && npm run build

      - name: Smoke test
        run: |
          TOKEN=$(node -e "
            const crypto = require('crypto');
            const b = (o) => Buffer.from(JSON.stringify(o)).toString('base64').replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'');
            const h = b({alg:'HS256',typ:'JWT'});
            const p = b({sub:'test',exp:Math.floor(Date.now()/1000)+3600});
            const s = crypto.createHmac('sha256','key').update(h+'.'+p).digest();
            console.log(h+'.'+p+'.'+s.toString('base64').replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,''));
          ")
          npx tsx cli/src/cli.ts "$TOKEN"

  gui:
    name: GUI — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install core (required by @core alias)
        run: cd core && npm install

      - name: Install GUI deps
        run: cd gui && npm install

      - name: Typecheck
        run: cd gui && npx tsc --noEmit

      - name: Vite build
        run: cd gui && npx vite build

  tauri:
    name: Tauri — build
    needs: [cli, gui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04
            args: "--target aarch64-unknown-linux-gnu"
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || (matrix.platform == 'ubuntu-22.04' && contains(matrix.args, 'aarch64') && 'aarch64-unknown-linux-gnu' || '') }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libatk1.0-dev \
            libatspi2.0-dev

      - name: Install ARM64 cross-compilation tools
        if: runner.os == 'Linux' && contains(matrix.args, 'aarch64')
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev:arm64 \
            libgtk-3-dev:arm64 \
            libgdk-pixbuf-2.0-dev:arm64 \
            libpango1.0-dev:arm64 \
            libcairo2-dev:arm64 \
            libatk1.0-dev:arm64 \
            libatspi2.0-dev:arm64 \
            libssl-dev:arm64 \
            libglib2.0-dev:arm64 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Install core
        run: cd core && npm install

      - name: Install frontend deps
        run: cd gui && npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          args: ${{ matrix.args }}
